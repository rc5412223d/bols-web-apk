name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Add Firebase configuration (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "Firebase secret not configured; building without native FCM credentials."
          fi
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BolsMinecraft-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish BolsMinecraft 1.3.4 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Publish BolsMinecraft 1.3.4 release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.4
          target_commitish: ${{ github.sha }}
          name: BolsMinecraft 1.3.4
          body: |
            ## BolsMinecraft 1.3.4

            ### 更新內容
            - 修正聊天室開啟時沒有自動捲動到最新訊息的問題。
            - 聊天室訊息中的網址可以直接點擊開啟。
            - 新增通知診斷，可查看 Android 通知權限、Firebase 初始化、FCM Token 與 Worker 註冊狀態。
            - Android 版本號更新至 1.3.4。

            ### 安裝
            下載下方的 `BolsMinecraft-1.3.4.apk`，在 Android 裝置上安裝。
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
